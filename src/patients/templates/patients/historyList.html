{% extends 'base.html' %}
{% block content %}
        <table>
        <thead>
        <tr>
            <th>
                Nombre
            </th>
            <th>
                Apellido
            </th>
            <th>
                Ingreso
            </th>
            <th>
                Ultima Visita
            </th>
        </tr>

        </thead>
        <tbody>
        {% for object in objects %}
            <tr>
                <td>
                    <a href="{% url 'history_detail' object.id %}">
                        {{ object.name }}
                    </a>
                </td>
                <td>
                    {{ object.lastname }}
                </td>
                <td>
                    {{ object.created_at }}
                </td>
                <td>
                    {{ object.updated_at }}
                </td>
            </tr>
        {% endfor %}
        </tbody>
        </table>
    <div>
        <p>
            <a href="{% url 'new_history' %}">crear nuevo</a>
        </p>
    </div>
{% endblock %}
