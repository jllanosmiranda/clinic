{% extends 'base.html' %}
{% block content %}
  <h1 class="h3 mb-3">Nueva consulta para {{ patient.name }} {{ patient.lastname }}</h1>
  <form method="post" class="card">
    <div class="card-body">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="d-flex gap-2 mt-2">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url 'history_detail' patient.id %}" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </div>
  </form>
{% endblock %}
